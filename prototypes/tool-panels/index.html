<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoFlow · 工具面板原型</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --ink: #172033;
      --muted: #667085;
      --line: #e2e8f0;
      --surface: #ffffff;
      --canvas: #eef2f7;
      --nav: #f7f9fc;
      --danger: #dc2626;
      --warning: #d97706;
      --success: #059669;
      --radius: 14px;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    svg { display: block; }

    .app {
      height: 100vh;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      background: #f8fafc;
    }

    .titlebar {
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      color: #dbeafe;
      background: linear-gradient(118deg, #0b1220 0%, #142039 58%, #172b50 100%);
      border-bottom: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 2px 12px rgba(15,23,42,.2);
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(145deg, #60a5fa, #2563eb 60%, #1d4ed8);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 4px 14px rgba(37,99,235,.35);
    }

    .brand-mark svg { width: 17px; height: 17px; }
    .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .brand strong { color: white; font-size: 14px; letter-spacing: .02em; }
    .brand span { color: #94a3b8; font-size: 12px; }
    .titlebar-spacer { flex: 1; }
    .prototype-badge { padding: 5px 9px; border: 1px solid rgba(147,197,253,.24); border-radius: 999px; color: #bfdbfe; background: rgba(37,99,235,.14); font-size: 11px; font-weight: 700; }
    .prototype-state-control { display: flex; align-items: center; gap: 14px; padding: 10px 24px; color: #cbd5e1; background: #111c30; border-bottom: 1px solid #263650; }
    .prototype-state-control[hidden] { display: none; }
    .prototype-state-control-label { flex: 0 0 auto; white-space: nowrap; color: #93c5fd; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
    .prototype-state-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    .prototype-state-button { min-height: 29px; padding: 0 11px; border: 1px solid #3a4a64; border-radius: 7px; color: #cbd5e1; background: #1a2942; cursor: pointer; font-size: 10px; font-weight: 800; }
    .prototype-state-button:hover { border-color: #60a5fa; background: #203452; }
    .prototype-state-button.active { color: #fff; border-color: #3b82f6; background: #2563eb; }
    .prototype-state-button:focus-visible { outline: 3px solid rgba(96,165,250,.32); outline-offset: 1px; }
    .window-actions { display: flex; gap: 2px; }
    .window-actions span { width: 32px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: #94a3b8; font-size: 13px; }

    .layout { min-height: 0; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
    .sidebar {
      min-height: 0;
      padding: 18px 12px 16px;
      overflow-y: auto;
      background: var(--nav);
      border-right: 1px solid var(--line);
    }

    .sidebar-head { padding: 0 10px 14px; }
    .sidebar-head h1 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .sidebar-head p { margin: 5px 0 0; color: #8490a4; font-size: 11px; line-height: 1.55; }
    .section-label { margin: 16px 10px 6px; color: #98a2b3; font-size: 10px; font-weight: 800; letter-spacing: .11em; }
    .nav-list { display: grid; gap: 3px; }
    .nav-item {
      width: 100%;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border: 0;
      border-radius: 9px;
      text-align: left;
      background: transparent;
      cursor: pointer;
      transition: background .16s, color .16s, transform .16s;
    }

    .nav-item:hover { background: #edf2f8; }
    .nav-item.active { color: #174ea6; background: #e7f0ff; box-shadow: inset 0 0 0 1px #d5e5ff; }
    .nav-item.active .nav-icon { color: white; background: var(--blue); box-shadow: 0 4px 10px rgba(37,99,235,.24); }
    .nav-item:focus-visible { outline: 3px solid rgba(37,99,235,.18); outline-offset: 1px; }
    .nav-icon { width: 30px; height: 30px; display: grid; place-items: center; color: #667085; background: #fff; border: 1px solid #e5eaf1; border-radius: 8px; font-size: 13px; font-weight: 800; }
    .nav-icon svg { width: 16px; height: 16px; }
    .nav-copy { min-width: 0; }
    .nav-copy b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .nav-copy small { display: block; margin-top: 2px; color: #98a2b3; font-size: 9px; }
    .nav-count { min-width: 20px; padding: 2px 5px; border-radius: 99px; color: #8490a4; background: #fff; border: 1px solid #e4e9f0; text-align: center; font-size: 9px; }

    .content { min-width: 0; min-height: 0; overflow: auto; background: #f8fafc; }
    .content-head {
      min-height: 82px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: rgba(255,255,255,.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .content-head-copy { min-width: 0; }
    .crumb { color: #98a2b3; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .content-head h2 { margin: 3px 0 0; font-size: 20px; letter-spacing: -.025em; }
    .content-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .content-head-meta { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 4px #d1fae5; }
    .status-text { color: #667085; font-size: 10px; font-weight: 700; }

    .stage {
      min-height: calc(100vh - 134px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 30px;
      background-color: #e8edf5;
      background-image: radial-gradient(circle at 1px 1px, rgba(71,85,105,.13) 1px, transparent 0);
      background-size: 22px 22px;
    }

    .panel-window {
      width: min(100%, 960px);
      overflow: hidden;
      border: 1px solid rgba(148,163,184,.42);
      border-radius: 16px;
      background: white;
      box-shadow: 0 24px 60px rgba(15,23,42,.18), 0 2px 8px rgba(15,23,42,.06);
      animation: panel-in .23s ease-out;
    }

    @keyframes panel-in { from { opacity: 0; transform: translateY(5px) scale(.994); } to { opacity: 1; transform: none; } }
    .panel-window-head { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line); background: #fff; }
    .panel-title-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--blue); background: var(--blue-50); font-size: 15px; font-weight: 800; }
    .panel-title-icon svg { width: 18px; height: 18px; }
    .panel-window-head h3 { margin: 0; font-size: 15px; }
    .panel-window-head p { margin: 2px 0 0; color: #98a2b3; font-size: 10px; }
    .panel-close { margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 7px; color: #64748b; background: transparent; font-size: 18px; }
    .panel-body { padding: 22px; background: #fff; }
    .demo-area { pointer-events: none; user-select: none; }
    .demo-ribbon { position: relative; }
    .demo-ribbon::after { content: "展示原型"; position: absolute; z-index: 2; right: 18px; top: 14px; padding: 4px 7px; border-radius: 5px; color: #64748b; background: #f1f5f9; border: 1px solid #e2e8f0; font-size: 9px; font-weight: 800; letter-spacing: .04em; }

    .overview { width: min(100%, 1180px); }
    .overview-intro { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
    .overview-intro h3 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .overview-intro p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .overview-stat { margin-left: auto; color: #1d4ed8; font-size: 12px; font-weight: 800; }
    .overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .overview-card { min-width: 0; overflow: hidden; border: 1px solid #dce3ed; border-radius: 13px; background: #fff; box-shadow: 0 7px 18px rgba(15,23,42,.05); cursor: pointer; transition: transform .17s, box-shadow .17s, border-color .17s; }
    .overview-card:hover { transform: translateY(-2px); border-color: #b9d2ff; box-shadow: 0 12px 26px rgba(37,99,235,.1); }
    .overview-card:focus-visible { outline: 3px solid rgba(37,99,235,.2); outline-offset: 2px; }
    .mini-panel { height: 118px; padding: 12px; background: linear-gradient(145deg,#f9fbfe,#edf3fa); border-bottom: 1px solid #e7ecf2; }
    .mini-window { height: 100%; overflow: hidden; border: 1px solid #d8e0ea; border-radius: 7px; background: white; box-shadow: 0 5px 12px rgba(15,23,42,.08); }
    .mini-head { height: 21px; display: flex; align-items: center; padding: 0 7px; border-bottom: 1px solid #e6eaf0; }
    .mini-head::before { content: ""; width: 28%; height: 4px; border-radius: 9px; background: #94a3b8; }
    .mini-head::after { content: "×"; margin-left: auto; color: #a8b1bf; font-size: 9px; }
    .mini-body { display: grid; gap: 5px; padding: 7px; }
    .mini-callout { height: 14px; border-radius: 4px; background: #eaf2ff; border: 1px solid #d7e7ff; }
    .mini-row { height: 10px; border-radius: 3px; background: #edf0f4; }
    .mini-row.short { width: 63%; }
    .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .mini-grid span { height: 24px; border-radius: 4px; background: #f3f5f8; border: 1px solid #e7ebf0; }
    .mini-button { justify-self: end; width: 38%; height: 12px; border-radius: 4px; background: #3b82f6; }
    .overview-card-copy { padding: 12px 13px 13px; }
    .overview-card-copy b { display: block; font-size: 12px; }
    .overview-card-copy span { display: block; margin-top: 4px; color: #8490a4; font-size: 10px; line-height: 1.45; }
    .overview-card-copy em { display: inline-block; margin-top: 8px; padding: 2px 6px; border-radius: 99px; color: #4b5563; background: #f1f5f9; font-size: 9px; font-style: normal; font-weight: 700; }

    .stack { display: grid; gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .card { border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .card-pad { padding: 15px; }
    .card.soft { background: #f8fafc; }
    .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .card-head b { font-size: 12px; }
    .card-head span { margin-left: auto; color: #98a2b3; font-size: 10px; }
    .callout { padding: 12px 14px; border-radius: 10px; color: #1e4e90; background: #eff6ff; border: 1px solid #dbeafe; }
    .callout.warning { color: #92400e; background: #fffbeb; border-color: #fde68a; }
    .callout.danger { color: #991b1b; background: #fef2f2; border-color: #fecaca; }
    .callout.success { color: #065f46; background: #ecfdf5; border-color: #a7f3d0; }
    .callout b { display: block; font-size: 12px; }
    .callout p { margin: 4px 0 0; font-size: 10px; line-height: 1.6; }

    .field { display: grid; gap: 6px; min-width: 0; }
    .field > span, .field-label { color: #5e6b7e; font-size: 10px; font-weight: 800; }
    .input, .select, .textarea { width: 100%; border: 1px solid #d7dee8; border-radius: 8px; color: #27364d; background: #fff; outline: none; }
    .input, .select { height: 36px; padding: 0 10px; font-size: 11px; }
    .textarea { min-height: 72px; padding: 9px 10px; resize: none; font-size: 10px; line-height: 1.55; }
    .input.mono, .textarea.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: #42526a; }
    .input-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 13px; border: 1px solid #d7dee8; border-radius: 8px; color: #46556a; background: #fff; font-size: 10px; font-weight: 800; }
    .button.primary { color: white; border-color: var(--blue); background: var(--blue); box-shadow: 0 5px 12px rgba(37,99,235,.18); }
    .button.danger { color: white; border-color: var(--danger); background: var(--danger); }
    .button.ghost-danger { color: var(--danger); border-color: #fecaca; background: #fff; }
    .button:disabled { color: #98a2b3; border-color: #e2e8f0; background: #f1f5f9; box-shadow: none; }
    .actions { display: flex; justify-content: flex-end; align-items: center; gap: 9px; padding-top: 4px; }
    .actions .hint { margin-right: auto; color: #98a2b3; font-size: 10px; }

    .state-scene { display: grid; gap: 12px; margin-bottom: 16px; padding: 15px; border: 1px solid #dbe4f0; border-radius: 11px; background: #f8fbff; }
    .state-scene.warning { border-color: #fde68a; background: #fffbeb; }
    .state-scene.success { border-color: #a7f3d0; background: #ecfdf5; }
    .state-scene.danger { border-color: #fecaca; background: #fef2f2; }
    .state-scene-head { display: flex; align-items: flex-start; gap: 10px; }
    .state-scene-head > div { min-width: 0; }
    .state-scene-head b { display: block; font-size: 12px; }
    .state-scene-head p { margin: 4px 0 0; color: #64748b; font-size: 10px; line-height: 1.6; }
    .state-badge { flex: 0 0 auto; padding: 4px 7px; border-radius: 999px; color: #1d4ed8; background: #dbeafe; font-size: 9px; font-weight: 800; }
    .state-scene.warning .state-badge { color: #92400e; background: #fde68a; }
    .state-scene.success .state-badge { color: #065f46; background: #a7f3d0; }
    .state-scene.danger .state-badge { color: #991b1b; background: #fecaca; }
    .state-percent { margin-left: auto; color: #475569; font-size: 11px; font-weight: 800; }
    .state-metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
    .state-metric { padding: 9px 10px; border: 1px solid rgba(148,163,184,.24); border-radius: 8px; background: rgba(255,255,255,.72); }
    .state-metric span { display: block; color: #8490a4; font-size: 9px; }
    .state-metric b { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .issue-list { overflow: hidden; border: 1px solid #f3c7a7; border-radius: 8px; background: rgba(255,255,255,.76); }
    .issue-list-head { padding: 8px 10px; color: #9a3412; background: #fff7ed; border-bottom: 1px solid #fed7aa; font-size: 10px; font-weight: 800; }
    .issue-row { display: grid; grid-template-columns: minmax(140px,.7fr) minmax(0,1.3fr); gap: 10px; padding: 8px 10px; border-bottom: 1px solid #f3e8df; font-size: 10px; }
    .issue-row:last-child { border-bottom: 0; }
    .issue-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .issue-row span { color: #9a3412; }
    .state-log { display: grid; gap: 4px; padding: 9px 10px; border-radius: 8px; color: #cbd5e1; background: #111c30; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; line-height: 1.55; }
    .state-log span::before { content: "› "; color: #60a5fa; }
    .state-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .panel-base.is-hidden { display: none; }

    .dropzone { min-height: 122px; display: grid; place-items: center; padding: 20px; border: 1.5px dashed #cbd5e1; border-radius: 11px; text-align: center; background: #fafcff; }
    .drop-icon { width: 42px; height: 42px; display: grid; place-items: center; margin: 0 auto 9px; border-radius: 12px; color: var(--blue); background: var(--blue-50); font-size: 18px; font-weight: 800; }
    .dropzone b { display: block; font-size: 12px; }
    .dropzone p { margin: 5px 0 0; color: #8490a4; font-size: 10px; }

    .toggle-row, .list-row { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 9px 11px; border-bottom: 1px solid #edf0f4; }
    .toggle-row:last-child, .list-row:last-child { border-bottom: 0; }
    .toggle-copy { min-width: 0; }
    .toggle-copy b, .list-row b { display: block; font-size: 11px; }
    .toggle-copy small, .list-row small { display: block; margin-top: 3px; color: #98a2b3; font-size: 9px; line-height: 1.4; }
    .switch { flex: 0 0 auto; width: 31px; height: 18px; position: relative; margin-left: auto; border-radius: 99px; background: #cbd5e1; }
    .switch::after { content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; border-radius: 50%; background: white; box-shadow: 0 1px 4px rgba(15,23,42,.25); }
    .switch.on { background: var(--blue); }
    .switch.on::after { left: 15px; }

    .file-icon { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: #2563eb; background: #eff6ff; font-size: 9px; font-weight: 900; }
    .file-icon.video { color: #7c3aed; background: #f5f3ff; }
    .file-icon.raw { color: #b45309; background: #fffbeb; }
    .file-icon.danger { color: #dc2626; background: #fef2f2; }
    .row-meta { margin-left: auto; color: #98a2b3; font-size: 9px; white-space: nowrap; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 99px; color: #475569; background: #f1f5f9; font-size: 9px; font-weight: 800; }
    .pill.blue { color: #1d4ed8; background: #dbeafe; }
    .pill.green { color: #047857; background: #d1fae5; }
    .pill.amber { color: #b45309; background: #fef3c7; }
    .pill.red { color: #b91c1c; background: #fee2e2; }

    .progress-wrap { padding: 13px; border-radius: 10px; background: #0f172a; color: #cbd5e1; }
    .progress-head { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; font-size: 10px; }
    .progress-head b { color: white; }
    .progress-head span { margin-left: auto; color: #93c5fd; font-weight: 800; }
    .progress { height: 5px; overflow: hidden; border-radius: 99px; background: #334155; }
    .progress i { display: block; height: 100%; width: var(--value, 38%); border-radius: inherit; background: linear-gradient(90deg,#3b82f6,#60a5fa); }
    .log { margin-top: 9px; color: #7f8fa7; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 8px; }

    .segmented { display: inline-flex; padding: 3px; border-radius: 8px; background: #f1f5f9; }
    .segmented span { padding: 5px 9px; border-radius: 6px; color: #64748b; font-size: 9px; font-weight: 800; }
    .segmented span.active { color: #1d4ed8; background: white; box-shadow: 0 1px 4px rgba(15,23,42,.08); }
    .section-title { display: flex; align-items: center; gap: 8px; }
    .section-title b { font-size: 12px; }
    .section-title small { color: #98a2b3; font-size: 9px; }
    .section-title .pill { margin-left: auto; }

    .media-preview { position: relative; min-height: 192px; overflow: hidden; border-radius: 11px; background: linear-gradient(135deg,#172033,#334155); }
    .media-preview::before { content: ""; position: absolute; inset: 16% 10%; border-radius: 10px; background: linear-gradient(150deg,#f5d0a9 0 28%,#78a6b6 28% 53%,#263a51 53% 100%); opacity: .9; }
    .media-preview::after { content: "预览画面"; position: absolute; left: 12px; bottom: 10px; padding: 3px 6px; border-radius: 5px; color: white; background: rgba(15,23,42,.65); font-size: 8px; }
    .crop-box { position: absolute; z-index: 1; left: 25%; right: 18%; top: 17%; bottom: 16%; border: 2px solid white; box-shadow: 0 0 0 999px rgba(15,23,42,.43), 0 0 0 1px rgba(37,99,235,.8); }
    .crop-box::before, .crop-box::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 2px; background: white; }
    .crop-box::before { left: -4px; top: -4px; }
    .crop-box::after { right: -4px; bottom: -4px; }

    .cache-meter { display: flex; align-items: center; gap: 18px; }
    .donut { width: 88px; height: 88px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(#3b82f6 0 62%,#e5eaf1 62% 100%); }
    .donut::before { content: "62%"; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; color: #334155; background: white; font-size: 14px; font-weight: 900; }
    .cache-copy strong { display: block; font-size: 18px; }
    .cache-copy p { margin: 5px 0 0; color: #8490a4; font-size: 10px; line-height: 1.6; }

    .timeline { position: relative; display: grid; gap: 12px; padding-left: 23px; }
    .timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 1px; background: #dbe3ee; }
    .timeline-item { position: relative; padding: 11px 12px; border: 1px solid #e3e8ef; border-radius: 9px; background: #fff; }

          <div class="callout warning"><b>版本管理不保存历史文件副本</b><p>原地覆盖或永久删除的旧内容无法通过本功能恢复；文件移动或删除后会显示“文件丢失”，可重新定位或删除记录。</p></div>
          <div class="workspace-preview-grid">
            <aside style="padding:12px;background:#fff;border-right:1px solid #e2e8f0"><div class="card-head"><b>版本树</b><span>3 个版本</span></div><div class="timeline"><div class="timeline-item active"><b>V3 · 精修三版 ✓</b><p>当前版本 · 今天 18:42</p></div><div class="timeline-item"><b>V2 · 精修二版</b><p>昨天 23:16</p></div><div class="timeline-item"><b>V1 · 初修</b><p>8 月 3 日 14:28</p></div></div><p style="margin:12px 2px 0;color:#8490a4;font-size:9px">勾选任意两个可进入版本对比。</p></aside>
            <main style="display:flex;flex-direction:column;background:#f8fafc"><div style="padding:11px 13px;border-bottom:1px solid #e2e8f0"><b style="font-size:10px">预览</b><small style="display:block;margin-top:3px;color:#8490a4;font-size:9px">DSC08214.psd</small></div><div class="media-preview" style="flex:1;border-radius:0"></div></main>
            <aside style="padding:12px;background:#fff;border-left:1px solid #e2e8f0"><div class="card-head"><b>详细信息</b><span>⋯</span></div><dl style="margin:0;font-size:10px"><div class="list-row" style="padding-left:0;padding-right:0"><span style="color:#98a2b3">版本</span><b style="margin-left:auto">V3 · 精修三版</b></div><div class="list-row" style="padding-left:0;padding-right:0"><span style="color:#98a2b3">标记</span><b style="margin-left:auto">当前版本</b></div><div class="list-row" style="padding-left:0;padding-right:0"><span style="color:#98a2b3">文件大小</span><b style="margin-left:auto">218.6 MB</b></div><div class="list-row" style="padding-left:0;padding-right:0"><span style="color:#98a2b3">状态</span><b style="margin-left:auto">正常</b></div><div style="padding:10px 0;border-bottom:1px solid #edf0f4"><span style="color:#98a2b3">版本说明</span><p style="margin:5px 0 0;line-height:1.5">完成肤色与背景调整</p></div></dl><div class="stack" style="gap:6px;margin-top:12px">${button('编辑版本说明')}${button('复制文件地址')}${button('删除版本记录','ghost-danger')}</div></aside>
          </div>
        </div>`),

      'team-retouch': () => panel('team-retouch', 'users-round', '团片协作 · 4 张图片', '独立工作区标签：先识别与标记人物，再进入任务编排与返图。', `
        <div class="stack demo-area">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="segmented"><span class="active">① 人物识别与标记</span><span>② 任务编排与返图</span></div><div style="margin-left:auto;display:flex;gap:8px">${button('重新识别全部图片')}${button('重新自动标记人物','primary')}</div></div>
          <section class="card"><header style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #e2e8f0"><div><b style="font-size:12px">DSC08214.jpg</b><small style="display:block;margin-top:3px;color:#667085;font-size:9px">2 张工作图 · 3/4 个人物已标记 · 1 张建议检查</small></div><span class="pill amber" style="margin-left:auto">建议检查</span></header>
            <div class="grid-2" style="padding:14px"><div><div class="media-preview"><span class="crop-box"></span></div><p style="margin:8px 0 0;color:#8490a4;font-size:9px;line-height:1.5">蓝框是工作图范围；每个人物使用独立颜色和编号。橙色框表示建议检查。</p></div><div class="stack" style="gap:9px"><article class="card card-pad"><div class="card-head"><b>工作图 1</b><span class="pill green">已标记</span></div><div class="list-row"><span class="pill blue">人物 1</span><b>林女士</b><span class="row-meta">已人工确认</span></div><div class="list-row"><span class="pill amber">人物 2</span><b>陈先生</b><span class="row-meta">自动候选</span></div></article><article class="card card-pad"><div class="card-head"><b>工作图 2</b><span class="pill amber">建议检查</span></div><div class="list-row"><span class="pill">人物 3</span><b>未标记</b><span class="row-meta">去标记</span></div><div class="actions" style="margin-top:10px">${button('调整范围')}${button('删除工作图','ghost-danger')}</div></article></div></div>
          </section>
          <div class="callout"><b>人物标记完成后才进入第二步</b><p>第二步由身份管理工作区生成任务、导出工作图、接收返图并合成；不是在线成员协同面板，也没有“在线人数”概念。</p></div>
        </div>`),

      'trash': () => panel('trash', 'trash', '移入回收站', '项目级删除确认，不是所选文件列表。', `
        <div class="stack demo-area">
          <p style="margin:0;color:#667085;font-size:12px">项目“26-8-5 春日人像”及其全部内容将移入系统回收站。</p>
          <div class="callout danger"><b>删除范围：整个项目目录</b><p>该入口来自项目菜单；项目内所选文件的删除使用文件操作确认，不会打开这个项目删除面板。</p></div>
          <div class="actions">${button('确认移入回收站','danger')}</div>
        </div>`),

      'video-split': () => panel('video-split', 'scissors', '视频切割', '将单个大型视频无损切成约 3.95 GB 的连续分段。', `
        <div class="stack demo-area">
          ${selectedFileList('已选择 1 个视频','原视频保留；分段文件写入原视频所在目录','12.7 GB',[
            ['MP4','DJI_0834.MP4','春日人像 / 花絮 · 等待','video']
          ])}
          <div class="grid-2">
            ${field('分段大小','约 3.95 GB（固定）')}
            ${field('输出名称','DJI_0834_part001.MP4')}
          </div>
          ${progress('等待开始视频切割', 0)}
          <div class="actions">${button('重新选择')}${button('开始切割','primary')}</div>
        </div>`),

      'office-extract': () => panel('office-extract', 'file-image', '提取 Office 图片', '从 Office Open XML 文档中提取内嵌图片，并在文档旁生成结果文件夹。', `
        <div class="stack demo-area">
          ${selectedFileList('已选择 3 个 Office 文档','支持 Word、PowerPoint 与 Excel 的 Open XML 文件','3 个文件',[
            ['PPTX','客户方案.pptx','春日人像 / 策划 · 等待'],
            ['DOCX','拍摄需求.docx','春日人像 / 客户资料 · 等待'],
            ['XLSX','报价清单.xlsx','春日人像 / 客户资料 · 等待']
          ])}
          <div class="callout"><b>输出到文档旁</b><p>每个文档分别生成“文档名_media”文件夹；重名时自动编号，不修改原 Office 文档。</p></div>
          ${progress('等待开始提取图片', 0)}
          <div class="actions">${button('重新选择')}${button('开始提取','primary')}</div>
        </div>`)
    };

    function panel(panelId, icon, title, description, body) {
      const defaultState = defaultPanelStates[panelId] || stateCatalog[panelId]?.[0]?.id;
      const hideBase = selectedPanelStates[panelId] !== defaultState;
      return `<article class="panel-window demo-ribbon"><header class="panel-window-head"><span class="panel-title-icon">${iconSvg(icon)}</span><div><h3>${title}</h3><p>${description}</p></div><button class="panel-close" aria-label="关闭" type="button">×</button></header><div class="panel-body">${renderStateScene(panelId)}<div class="panel-base ${hideBase ? 'is-hidden' : ''}">${body}</div></div></article>`;
    }

    function miniPreview(index) {
      const variants = [
        '<div class="mini-callout"></div><div class="mini-grid"><span></span><span></span></div><div class="mini-button"></div>',
        '<div class="mini-row"></div><div class="mini-row short"></div><div class="mini-callout"></div><div class="mini-button"></div>',
        '<div class="mini-grid"><span></span><span></span></div><div class="mini-row"></div><div class="mini-row short"></div>',
        '<div class="mini-callout"></div><div class="mini-row"></div><div class="mini-row"></div><div class="mini-button"></div>'
      ];
      return `<div class="mini-panel"><div class="mini-window"><div class="mini-head"></div><div class="mini-body">${variants[index % variants.length]}</div></div></div>`;
    }

    function renderOverview() {
      const stateCount = Object.values(stateCatalog).reduce((total, states) => total + states.length, 0);
      return `<div class="overview"><div class="overview-intro"><div><h3>全部工具面板</h3><p>按当前入口统一展示导入、处理、协作与管理功能。</p></div><div class="overview-stat">17 个面板 · ${stateCount} 个状态</div></div><div class="overview-grid">${panelItems.map((item,index) => `<article class="overview-card" tabindex="0" data-open="${item.id}">${miniPreview(index)}<div class="overview-card-copy"><b>${item.title}</b><span>${item.subtitle}</span><em>${details[item.id].group} · ${stateCatalog[item.id].length} 个状态</em></div></article>`).join('')}</div></div>`;
    }

    function renderNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = groups.map(group => `<div class="section-label">${group.title}</div><div class="nav-list">${group.items.map(item => `<button class="nav-item" data-id="${item.id}" type="button"><span class="nav-icon">${iconSvg(item.icon)}</span><span class="nav-copy"><b>${item.title}</b><small>${item.subtitle}</small></span>${item.id === 'overview' ? '<span class="nav-count">17</span>' : ''}</button>`).join('')}</div>`).join('');
      const mobile = document.getElementById('mobile-select');
      mobile.innerHTML = groups.map(group => `<optgroup label="${group.title}">${group.items.map(item => `<option value="${item.id}">${item.title}</option>`).join('')}</optgroup>`).join('');
    }

    function showPanel(id, updateHash = true) {
      if (!details[id]) id = 'overview';
      const item = details[id];
      const stage = document.getElementById('stage');
      stage.innerHTML = id === 'overview' ? renderOverview() : templates[id]();
      updatePrototypeStateControl(id);
      document.getElementById('page-title').textContent = id === 'overview' ? '全部工具面板' : item.title;
      document.getElementById('page-description').textContent = id === 'overview' ? '统一查看导入、处理、协作与管理工具及其过程状态。' : item.subtitle + ` · ${stateCatalog[id]?.length || 0} 个静态状态，不执行真实业务。`;
      document.getElementById('breadcrumb').textContent = id === 'overview' ? '面板总览 / All panels' : item.group + ' / ' + item.title;
      document.querySelectorAll('.nav-item').forEach(button => button.classList.toggle('active', button.dataset.id === id));
      document.getElementById('mobile-select').value = id;
      if (updateHash) history.replaceState(null, '', '#' + id);
      document.querySelector('.content').scrollTo({ top: 0, behavior: 'instant' });
      document.querySelectorAll('[data-open]').forEach(card => {
        const open = () => showPanel(card.dataset.open);
        card.addEventListener('click', open);
        card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } });
      });
    }

    renderNav();
    document.getElementById('nav').addEventListener('click', event => {
      const button = event.target.closest('[data-id]');
      if (button) showPanel(button.dataset.id);
    });
    document.getElementById('mobile-select').addEventListener('change', event => showPanel(event.target.value));
    document.getElementById('prototype-state-buttons').addEventListener('click', event => {
      const button = event.target.closest('[data-prototype-state]');
      if (!button) return;
      const panelId = button.dataset.prototypePanel;
      selectedPanelStates[panelId] = button.dataset.prototypeState;
      showPanel(panelId, false);
    });
    window.addEventListener('hashchange', () => showPanel(location.hash.slice(1) || 'overview', false));
    showPanel(location.hash.slice(1) || 'overview', false);
  </script>
</body>
</html>
