<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>视频字幕设置</title><link rel="stylesheet" href="style.css"></head>
<body class="settings-body"><main class="settings-main"><header><span class="eyebrow">TRANSCRIPTION ENGINE</span><h1>视频字幕设置</h1><p>设置由 Host API V7 保存。绝对路径和令牌不会进入此页面。</p></header>
<form id="settings-form" class="settings-card"><label>语言<select name="language"><option value="zh">中文</option><option value="auto">自动检测</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option></select></label><label>模型<input name="model" maxlength="80" value="large-v3"></label><label>设备<select name="device"><option value="cuda">CUDA</option><option value="cpu">CPU</option><option value="auto">自动</option></select></label><label>计算类型<select name="computeType"><option value="float16">float16</option><option value="int8">int8</option><option value="int8_float16">int8_float16</option><option value="float32">float32</option><option value="default">default</option></select></label><label>Beam size<input name="beamSize" type="number" min="1" max="10"></label><label class="check"><input name="vadFilter" type="checkbox"> 启用 VAD 静音过滤</label><label class="check"><input name="simplifyChinese" type="checkbox"> 中文结果转为简体</label><label class="check"><input name="cpuFallback" type="checkbox"> CUDA 失败时回退 CPU int8</label><button type="submit">保存设置</button><p id="save-status" role="status"></p></form>
<section class="runtime-card"><h2>算法运行时</h2><p id="runtime-detail">正在诊断…</p><button id="diagnose" type="button">重新诊断</button></section></main><script src="settings.js"></script></body></html>
