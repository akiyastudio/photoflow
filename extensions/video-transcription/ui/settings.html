<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>视频转文字设置</title><link rel="stylesheet" href="host-api-ui.css"><link rel="stylesheet" href="style.css"></head>
<body class="settings-body pf-canvas"><main class="settings-main"><header class="settings-header"><h1>视频转文字</h1><p>配置本地识别引擎和字幕生成方式。</p></header><form id="settings-form">
  <section class="settings-card pf-card"><div class="settings-group-title"><h2>识别</h2><p>控制语言、模型与解码质量。</p></div><div class="settings-rows">
    <label class="setting-row"><span><strong>语言</strong><small>自动检测或指定音频语言</small></span><select class="pf-input" name="language"><option value="zh">中文</option><option value="auto">自动检测</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option></select></label>
    <label class="setting-row"><span><strong>模型</strong><small>本机可用的 faster-whisper 模型</small></span><input class="pf-input" name="model" maxlength="80" value="large-v3"></label>
    <label class="setting-row"><span><strong>Beam size</strong><small>数值越大通常越准确，但速度更慢</small></span><input class="pf-input" name="beamSize" type="number" min="1" max="10"></label>
    <label class="setting-row switch-row"><span><strong>静音过滤</strong><small>跳过无语音片段</small></span><input name="vadFilter" type="checkbox"></label>
    <label class="setting-row switch-row"><span><strong>简体中文</strong><small>将中文识别结果转换为简体</small></span><input name="simplifyChinese" type="checkbox"></label>
  </div></section>
  <section class="settings-card pf-card"><div class="settings-group-title"><h2>性能</h2><p>选择推理设备和计算精度。</p></div><div class="settings-rows">
    <label class="setting-row"><span><strong>设备</strong><small>优先使用的识别设备</small></span><select class="pf-input" name="device"><option value="cuda">CUDA</option><option value="cpu">CPU</option><option value="auto">自动</option></select></label>
    <label class="setting-row"><span><strong>计算类型</strong><small>根据显卡和性能需求选择</small></span><select class="pf-input" name="computeType"><option value="float16">float16</option><option value="int8">int8</option><option value="int8_float16">int8_float16</option><option value="float32">float32</option><option value="default">default</option></select></label>
    <label class="setting-row switch-row"><span><strong>CPU 回退</strong><small>CUDA 失败时使用 CPU int8 继续</small></span><input name="cpuFallback" type="checkbox"></label>
  </div></section>
  <div class="settings-save"><p id="save-status" role="status"></p><button class="pf-button pf-button-primary" type="submit">保存设置</button></div>
</form><section class="runtime-card pf-card"><div><h2>算法运行时</h2><p id="runtime-detail">正在诊断…</p></div><button class="pf-button" id="diagnose" type="button">重新诊断</button></section></main><script src="settings.js"></script></body></html>
