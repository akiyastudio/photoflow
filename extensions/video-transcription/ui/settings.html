<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>视频转文字设置</title>
  <link rel="stylesheet" href="host-api-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="component-settings-root">
  <main class="pf-settings-page">
    <form id="settings-form" class="pf-settings-container">
      <header class="pf-settings-header"><h1 class="pf-settings-title">视频转文字设置</h1><p id="save-status" class="pf-settings-subtitle" role="status" aria-live="polite"></p></header>
      <section class="pf-settings-group">
        <h2 class="pf-settings-group-title">识别</h2>
        <div class="pf-settings-card">
          <div class="pf-settings-row"><div class="pf-settings-copy"><label class="pf-settings-row-title" for="language-select">语言</label><p class="pf-settings-description">自动检测或指定音频语言。</p></div><div class="pf-settings-control"><select class="pf-select pf-settings-field" id="language-select" name="language"><option value="zh">中文</option><option value="auto">自动检测</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option></select></div></div>
          <div class="pf-settings-row"><div class="pf-settings-copy"><label class="pf-settings-row-title" for="model-select">模型</label><p class="pf-settings-description">只能选择已安装的 faster-whisper 模型；切换仅影响新任务。</p></div><div class="pf-settings-control"><select class="pf-select pf-settings-field" id="model-select" name="model" disabled><option value="">正在读取模型…</option></select></div></div>
          <div class="pf-settings-row"><div class="pf-settings-copy"><label class="pf-settings-row-title" for="beam-size">Beam size</label><p class="pf-settings-description">数值越大通常越准确，但速度更慢。</p></div><div class="pf-settings-control"><input class="pf-input pf-settings-field" id="beam-size" name="beamSize" type="number" min="1" max="10" step="1"></div></div>
          <div class="pf-settings-row"><div class="pf-settings-copy"><label class="pf-settings-row-title" for="vad-filter">静音过滤</label><p class="pf-settings-description">跳过无语音片段。</p></div><div class="pf-settings-control"><label class="pf-control-cluster"><input id="vad-filter" name="vadFilter" type="checkbox" aria-label="静音过滤"></label></div></div>
          <div class="pf-settings-row"><div class="pf-settings-copy"><label class="pf-settings-row-title" for="simplify-chinese">简体中文</label><p class="pf-settings-description">将中文识别结果转换为简体。</p></div><div class="pf-settings-control"><label class="pf-control-cluster"><input id="simplify-chinese" name="simplifyChinese" type="checkbox" aria-label="简体中文"></label></div></div>
        </div>
      </section>
      <section class="pf-settings-group">
        <h2 class="pf-settings-group-title">性能</h2>
        <div class="pf-settings-card">
          <div class="pf-settings-row"><div class="pf-settings-copy"><label class="pf-settings-row-title" for="device-select">设备</label><p class="pf-settings-description">优先使用的识别设备。</p></div><div class="pf-settings-control"><select class="pf-select pf-settings-field" id="device-select" name="device"><option value="cuda">CUDA</option><option value="cpu">CPU</option><option value="auto">自动</option></select></div></div>
          <div class="pf-settings-row"><div class="pf-settings-copy"><label class="pf-settings-row-title" for="compute-type">计算类型</label><p class="pf-settings-description">根据显卡和性能需求选择。</p></div><div class="pf-settings-control"><select class="pf-select pf-settings-field" id="compute-type" name="computeType"><option value="float16">float16</option><option value="int8">int8</option><option value="int8_float16">int8_float16</option><option value="float32">float32</option><option value="default">default</option></select></div></div>
          <div class="pf-settings-row"><div class="pf-settings-copy"><label class="pf-settings-row-title" for="cpu-fallback">CPU 回退</label><p class="pf-settings-description">CUDA 失败时使用 CPU int8 继续。</p></div><div class="pf-settings-control"><label class="pf-control-cluster"><input id="cpu-fallback" name="cpuFallback" type="checkbox" aria-label="CPU 回退"></label></div></div>
        </div>
      </section>
      <section class="pf-settings-group">
        <h2 class="pf-settings-group-title">模型管理</h2>
        <div class="pf-settings-card">
          <div class="pf-settings-row"><div class="pf-settings-copy"><h3 class="pf-settings-row-title">模型放置位置</h3><p id="model-placement" class="pf-settings-description">插件目录的 models/&lt;model-id&gt; 子目录</p></div><div class="pf-settings-control"><p class="pf-settings-description pf-settings-field">手动放置完整 CTranslate2 模型目录；组件不会隐式下载模型。</p></div></div>
          <div class="pf-settings-row"><div class="pf-settings-copy"><h3 class="pf-settings-row-title">安装状态</h3><p id="model-summary" class="pf-settings-description">正在检查…</p></div><div class="pf-settings-control"><div class="pf-control-cluster pf-settings-field"><button class="pf-button" id="refresh-models" type="button">刷新模型</button></div></div></div>
        </div>
      </section>
      <section class="pf-settings-group">
        <h2 class="pf-settings-group-title">算法运行时</h2>
        <div class="pf-settings-card"><div class="pf-settings-row"><div class="pf-settings-copy"><h3 class="pf-settings-row-title">运行时状态</h3><p id="runtime-detail" class="pf-settings-description">正在诊断…</p></div><div class="pf-settings-control"><div class="pf-control-cluster pf-settings-field"><button class="pf-button" id="diagnose" type="button">重新诊断</button></div></div></div></div>
      </section>
    </form>
  </main>
  <script src="settings-save-model.js"></script>
  <script src="settings.js"></script>
</body>
</html>
