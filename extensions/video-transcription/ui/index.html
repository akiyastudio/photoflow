<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>视频转文字</title><link rel="stylesheet" href="host-api-ui.css"><link rel="stylesheet" href="style.css"></head>
<body class="pf-canvas"><main class="app-shell">
  <header class="app-toolbar pf-toolbar"><div><h1>视频转文字</h1><p id="selection-summary">读取当前选择…</p></div><div class="toolbar-actions"><span class="pf-status" id="runtime-status">正在检查本地识别…</span><button class="pf-button pf-button-primary" id="reprocess" type="button" disabled>请在文件页选择视频或文件夹</button><button class="pf-button" id="refresh" type="button">刷新</button></div></header>
  <div class="pf-banner notice" id="notice" hidden role="status"></div>
  <section class="empty-selection pf-card" id="empty-selection" hidden><h2>尚未选择可处理内容</h2><p>请回到文件页面，选择一个或多个视频或包含视频的文件夹，然后点击“视频转文字”。</p></section>
  <section class="workspace pf-card" aria-label="字幕浏览器">
    <aside class="directory-pane"><div class="pane-heading"><label for="operation-select">目录</label><select class="pf-input" id="operation-select" aria-label="字幕目录"><option>遍历 SRT…</option></select><p id="operation-summary">项目内全部 SRT 字幕</p><div id="operation-actions" class="inline-actions"></div></div><nav id="file-tree" class="file-tree" aria-label="字幕文件目录">读取文件…</nav></aside>
    <article class="transcript-pane"><div class="section-heading detail-heading"><div><h2 id="transcript-title">识别文字</h2><p id="transcript-status">从左侧目录选择文件</p></div><div class="inline-actions"><button class="pf-button" id="browse-all" type="button">浏览全部</button><div id="file-actions" class="inline-actions"></div></div></div><div id="transcript-list" class="transcript-list" data-state="empty" tabindex="0"></div></article>
    <aside class="search-panel"><div class="section-heading search-heading"><div><h2>字幕搜索</h2><p>搜索当前项目所有已识别字幕</p></div></div><form id="search-form"><input class="pf-input" id="search-input" type="search" maxlength="200" placeholder="输入字幕关键词"><button class="pf-button search-submit" type="submit" aria-label="搜索" title="搜索"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></button></form><div id="search-results" class="results" aria-live="polite"></div><button class="pf-button search-more" id="search-more" type="button" hidden>加载更多结果</button></aside>
  </section>
</main><script src="explicit-start-model.js"></script><script src="selection-preview-model.js"></script><script src="transcript-browser-model.js"></script><script src="refresh-coordinator.js"></script><script src="app.js"></script></body></html>
