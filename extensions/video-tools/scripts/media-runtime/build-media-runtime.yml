name: Build video-tools audited FFmpeg runtime
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  ffmpeg-windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: base-devel autoconf automake libtool git make diffutils pkgconf nasm yasm mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-shaderc
      - shell: msys2 {0}
        run: bash extensions/video-tools/scripts/media-runtime/build-ffmpeg-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: video-tools-media-runtime-windows-x64
          path: extensions/video-tools/artifacts/installers/media-runtime/*
          if-no-files-found: error
